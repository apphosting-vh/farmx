<!DOCTYPE html>
<!--
  Farm Manager
  Version : 5.0.0
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta id="meta-theme-color" name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Farm Manager">
  <meta name="msapplication-TileColor" content="#0077b6">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="description" content="One Stop Solution for Farming Expense Management">
  <title>Farm Manager</title>
  <!--
    ═══════════════════════════════════════════════════════════
    PERFORMANCE: Resource Hints
    ─────────────────────────────────────────────────────────
    preconnect   – opens TCP+TLS to the origin NOW so the
                   connection is warm when the script fetch fires.
    preload      – tells the browser to fetch these large scripts
                   at HIGH priority in parallel, before the parser
                   reaches the <script> tags below.
    Both together shave 300–800 ms off first load, especially on
    mobile networks where connection setup is expensive.
    ═══════════════════════════════════════════════════════════
  -->
  <!-- Warm up CDN connections immediately -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">
  <!-- Preload the three blocking scripts so they download in parallel -->
  <link rel="preload" href="https://unpkg.com/react@18/umd/react.production.min.js" as="script" crossorigin>
  <link rel="preload" href="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" as="script" crossorigin>
  <link rel="preload" href="app-core.js" as="script">
  <link rel="preload" href="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js" as="script">
  <link rel="manifest" href="https://apphosting-vh.github.io/farmx/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sidebar-w: 210px;
      --sidebar-collapsed-w: 76px;
      --navy: #0d1f3c;
      --navy-mid: #162844;
      --navy-light: #1e3558;
      --teal: #00b896;
      --teal-dim: #009a7e;
      --surface: #eef2f7;
      --card: #ffffff;
      --border: #d8e3ee;
      --text-1: #0d1f3c;
      --text-2: #2c3e57;
      --text-3: #4a5e78;
      --label: #344054;
      --sublabel: #5a6e88;
      --success: #009a7e;
      --warning: #d48f00;
      --danger: #d93636;
      /* Sidebar theme vars — overwritten by React on theme change */
      --sidebar-bg: #0f172a;
      --sidebar-active-bg: rgba(0,184,150,0.18);
      --sidebar-active-fg: #00b896;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; padding:0;
      font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow:hidden;
      overscroll-behavior-y:contain;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
      padding-left:env(safe-area-inset-left);
      padding-right:env(safe-area-inset-right);
      background: var(--surface);
    }
    #root { height:100vh; height:100dvh; width:100vw; overflow:auto; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background: var(--navy);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      color:white; z-index:9999;
      padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    }
    #loading h1 { font-size:28px; margin:0 0 8px 0; font-family:'DM Sans',sans-serif; font-weight:700; letter-spacing:-0.5px; }
    #loading p { font-size:13px; color:rgba(255,255,255,0.5); letter-spacing:0.08em; text-transform:uppercase; margin:0 0 28px 0; }
    .loading-spinner { width:40px; height:40px; border:3px solid rgba(0,201,167,0.25); border-top-color:var(--teal); border-radius:50%; animation:spin 0.9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .safe-bottom { padding-bottom:calc(16px + env(safe-area-inset-bottom)) !important; }
    /* Sidebar scrollbar hidden */
    .fm-sidebar::-webkit-scrollbar { display:none; }
    .fm-sidebar { scrollbar-width:none; }
    /* Nav item hover */
    .fm-nav-item { transition: background 0.18s, color 0.18s; }
    .fm-nav-item:hover { background: rgba(255,255,255,0.07) !important; }
    /* Sidebar transition */
    .fm-sidebar { transition: width 0.26s cubic-bezier(0.4,0,0.2,1); }
    .fm-sidebar-label { transition: opacity 0.18s, width 0.18s; white-space: nowrap; overflow: hidden; }
    .fm-sidebar-section-label { transition: opacity 0.15s; white-space: nowrap; overflow: hidden; }
    /* Main content shift */
    .fm-main { transition: padding-left 0.26s cubic-bezier(0.4,0,0.2,1); }
    /* Mobile overlay backdrop */
    .fm-overlay { position: fixed; inset: 0; background: rgba(13,31,60,0.55); z-index: 190; backdrop-filter: blur(2px); animation: fadein 0.2s ease; }
    @keyframes fadein { from { opacity:0; } to { opacity:1; } }
    /* Tooltip for collapsed nav items */
    .fm-nav-item { position: relative; }
    .fm-nav-tooltip {
      position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
      background: var(--navy-light); color: white; font-size: 12px; font-weight: 600;
      padding: 5px 10px; border-radius: 7px; white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity 0.15s; z-index: 9999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .fm-nav-item:hover .fm-nav-tooltip { opacity: 1; }
    /* Card hover */
    .fm-action-card { transition: transform 0.18s, box-shadow 0.18s; }
    .fm-action-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(13,31,60,0.12) !important; }
    /* Update notification toast */
    @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(24px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    @keyframes pulseGlow { 0%,100% { box-shadow:0 8px 32px rgba(0,201,167,0.35); } 50% { box-shadow:0 8px 44px rgba(0,201,167,0.65); } }
    /* Number font */
    .fm-num { font-family:'DM Mono', monospace; }

    /* ── FIX #5: Utility classes — replace the most-repeated inline style objects ─ */
    .fm-page          { padding: 24px 28px; }
    .fm-card          { background: var(--card); border-radius: 16px; border: 1px solid var(--border); }
    .fm-card-shadow   { background: var(--card); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(13,31,60,0.05); }
    .fm-section-hdr   { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .fm-empty         { background: var(--card); border-radius: 16px; padding: 60px 20px; text-align: center; border: 1px solid var(--border); }
    .fm-page-title    { margin: 0; font-size: 22px; font-weight: 700; color: var(--text-1); }
    .fm-btn-primary   { background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dim) 100%); color: white; border: none; padding: 10px 18px; border-radius: 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(0,201,167,0.3); }
    .fm-list          { display: flex; flex-direction: column; gap: 12px; }
    .fm-month-nav     { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <script>
  // ── Source Protection ────────────────────────────────────────────────────
  (function() {
    'use strict';

    // 1. Disable right-click context menu
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }, true);

    // 2. Block keyboard shortcuts for DevTools, View Source, Save
    document.addEventListener('keydown', function(e) {
      var key = e.key ? e.key.toUpperCase() : '';
      var ctrl = e.ctrlKey || e.metaKey;

      // F12
      if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); return false; }
      // Ctrl/Cmd + Shift + I (DevTools)
      if (ctrl && e.shiftKey && key === 'I') { e.preventDefault(); e.stopPropagation(); return false; }
      // Ctrl/Cmd + Shift + J (DevTools Console)
      if (ctrl && e.shiftKey && key === 'J') { e.preventDefault(); e.stopPropagation(); return false; }
      // Ctrl/Cmd + Shift + C (Inspector)
      if (ctrl && e.shiftKey && key === 'C') { e.preventDefault(); e.stopPropagation(); return false; }
      // Ctrl/Cmd + U (View Source)
      if (ctrl && key === 'U') { e.preventDefault(); e.stopPropagation(); return false; }
      // Ctrl/Cmd + S (Save Page)
      if (ctrl && key === 'S') { e.preventDefault(); e.stopPropagation(); return false; }
      // Ctrl/Cmd + A (Select All) — only block when NOT focused on an editable element
      // so that select-all inside app inputs/textareas still works normally
      if (ctrl && key === 'A') {
        var tag = document.activeElement ? document.activeElement.tagName : '';
        var editable = document.activeElement && document.activeElement.isContentEditable;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT' && !editable) {
          e.preventDefault(); e.stopPropagation(); return false;
        }
      }
      // Ctrl/Cmd + P (Print / Print Preview)
      if (ctrl && key === 'P') { e.preventDefault(); e.stopPropagation(); return false; }
    }, true);

    // 3. Disable text selection via CSS
    var style = document.createElement('style');
    style.textContent = [
      '* { -webkit-user-select: none !important; -moz-user-select: none !important;',
      '    -ms-user-select: none !important; user-select: none !important; }',
      // Re-enable selection only for <input>, <textarea>, <select> so the app still works
      'input, textarea, select { -webkit-user-select: text !important;',
      '  -moz-user-select: text !important; user-select: text !important; }'
    ].join('\n');
    document.head.appendChild(style);

    // 4. Disable drag (prevents dragging text/images to inspect)
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
      return false;
    }, true);

    // 5. Clear console periodically and on open, show a warning instead
    var consoleWarning = function() {
      console.clear();
      console.log('%c⛔ STOP', 'color:#d93636;font-size:48px;font-weight:900;');
      console.log('%cThis application is private. Inspecting or copying the source code is not permitted.', 'color:#d48f00;font-size:14px;font-weight:600;');
    };
    consoleWarning();
    setInterval(consoleWarning, 60000); // perf: was 2 s → 60 s, same deterrent, 30× less main-thread noise

    // 6. Disable print (Ctrl+P blocked above, but also catch beforeprint)
    window.addEventListener('beforeprint', function(e) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }, true);

  })();
  </script>
  <div id="loading">
    <h1>Farm Manager</h1>
    <p>Loading Calendar &amp; Payments first…</p>
    <div class="loading-spinner"></div>
  </div>
  <div id="root"></div>
  <script type="text/babel" src="app-core.js"></script>
  <script>
    window.addEventListener('load',()=>{
      // Fallback: hide the loading screen after 8 s if React somehow never mounts
      // (network error, Babel crash, etc.).  React hides it earlier via useEffect.
      setTimeout(()=>{const l=document.getElementById('loading');if(l)l.style.display='none';},8000);
    });
    if('serviceWorker'in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('https://apphosting-vh.github.io/farmx/sw.js')
          .then(reg=>{
            console.log('SW registered');
            window.__swReg = reg; // expose so React can call reg.waiting.postMessage

            // If the SW updates while the page is open, fire a custom event
            reg.addEventListener('updatefound',()=>{
              const sw = reg.installing;
              if(!sw) return;
              sw.addEventListener('statechange',()=>{
                if(sw.state==='installed' && navigator.serviceWorker.controller){
                  window.dispatchEvent(new CustomEvent('swUpdateReady'));
                }
              });
            });

            // Periodic re-check: ask the browser to look for a new SW every 30 min
            setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
          })
          .catch(e=>console.log('SW failed:',e));

        // ── Post-install warm-cache via requestIdleCallback ──────────────────
        // The SW broadcasts SW_READY_FOR_WARM_CACHE after its install phase.
        // We listen for it here and schedule idle-time prefetching of the
        // Google Fonts woff2 binaries that were NOT in the initial precache
        // list (only the CSS was precached). requestIdleCallback ensures this
        // runs between frames and never competes with user interaction.
        navigator.serviceWorker.addEventListener('message', evt => {
          if (!evt.data) return;

          if (evt.data.type === 'SW_READY_FOR_WARM_CACHE') {
            scheduleIdlePrefetch();
          }
        });

        // Also fire once immediately in case the SW was already installed
        // (e.g. a page reload) and the message was sent before we listened.
        if (navigator.serviceWorker.controller) {
          scheduleIdlePrefetch();
        }
      });
    }

    /**
     * scheduleIdlePrefetch()
     * Uses requestIdleCallback (with a setTimeout fallback for Safari) to
     * collect all <link rel="stylesheet"> Google Font URLs visible in the
     * document and send them to the SW as PREFETCH_FONTS. The SW then
     * fetches and caches the woff2 font binaries in the background,
     * ensuring sub-millisecond font delivery on every subsequent visit.
     */
    function scheduleIdlePrefetch() {
      // Guard: only run once per page load
      if (window.__idlePrefetchDone) return;
      window.__idlePrefetchDone = true;

      const run = () => {
        try {
          // Collect Google Fonts stylesheet URLs from the document head
          const fontSheetUrls = Array.from(
            document.querySelectorAll('link[rel="stylesheet"]')
          )
            .map(l => l.href)
            .filter(h => h && h.includes('fonts.googleapis.com'));

          if (!fontSheetUrls.length) return;

          // Ask the SW to warm-cache the font CSS (and any woff2 the SW
          // subsequently discovers from those stylesheets on its own).
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
              type: 'PREFETCH_FONTS',
              urls: fontSheetUrls,
            });
            console.log('[App] Sent PREFETCH_FONTS to SW:', fontSheetUrls);
          }
        } catch (e) {
          // Non-critical — silently ignore
        }
      };

      // requestIdleCallback fires during browser idle time (between frames).
      // The 2 s timeout ensures it eventually runs even if the browser is busy.
      if ('requestIdleCallback' in window) {
        requestIdleCallback(run, { timeout: 2000 });
      } else {
        // Safari / older browsers: defer 1.5 s after load, then run
        setTimeout(run, 1500);
      }
    }
  </script>
</body>
